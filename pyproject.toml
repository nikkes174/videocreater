[project]
name = "videocreater"
version = "0.1.0"
description = "BlackPhantom 15s showreel renderer (numpy + Pillow, synthesized audio)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=11",
    "scipy>=1.13",
]

[project.scripts]
render = "blackphantom_reel.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackphantom_reel"]
